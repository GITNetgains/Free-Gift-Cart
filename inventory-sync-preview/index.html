<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory sync - Local preview</title>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
  <style>
    body { margin: 0; background: #f1f1f1; font-family: Inter, system-ui, sans-serif; color: #303030; }
    .preview-bar { padding: 14px 24px; background: #1a1a1a; color: white; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; }
    .preview-bar span { flex: 1; min-width: 180px; }
    .preview-bar button { padding: 8px 12px; border: 1px solid #777; border-radius: 8px; background: #333; color: white; cursor: pointer; }
    dialog { border: 1px solid #ddd; border-radius: 14px; padding: 24px; width: min(480px, calc(100vw - 80px)); box-shadow: 0 20px 60px #0003; }
    dialog::backdrop { background: #0006; }
    dialog button { display: block; width: 100%; padding: 14px; margin-top: 12px; text-align: left; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
    dialog h2 { margin-top: 0; }
  </style>
</head>
<body><div id="root"></div><script type="module" src="/main.tsx"></script></body>
</html>
